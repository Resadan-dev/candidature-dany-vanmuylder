# Loads the copy of the delivered dashboard that
# scripts/prepare-dashboard.py writes into grafana/dashboards/.

apiVersion: 1

providers:
  - name: bhs
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
