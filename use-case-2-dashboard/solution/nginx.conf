# Reverse proxy: expose Grafana (localhost:3000) on port 80, the only port the
# Office -> BHS firewall allows. To be deployed on monitor.nce-bhs.local:
# official nginx container started with --network host (otherwise 127.0.0.1:3000
# is unreachable and the allowlist below sees the Docker bridge IP).
# Grafana prerequisites (grafana.ini): root_url = http://monitor.nce-bhs.local/
# and [live] allowed_origins = http://monitor.nce-bhs.local:3000 http://monitor.nce-bhs.local
# (without these, PLC sessions still on :3000 lose live updates after the switch).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen      80;
    server_name monitor.nce-bhs.local;

    # Only client allowed: the control room Dell Wyse (IP to be confirmed) —
    # every extra browser adds ~12 req/min on the API (shared rate limit).
    allow 192.168.10.60;
    allow 10.0.50.0/24;      # BHS VLAN (administration)
    deny  all;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket (Grafana Live)
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Tolerance for brief network drops on the TV side
        proxy_connect_timeout 5s;
        proxy_read_timeout    90s;
        proxy_send_timeout    90s;
    }
}
